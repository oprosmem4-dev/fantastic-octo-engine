version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tgsaas
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ── Бот-регистратор зеркал (главная точка входа для пользователей) ──────────
  # Пользователи приходят сюда, регистрируют свой токен → получают зеркало
  generator:
    build: .
    restart: unless-stopped
    command: python bot/generator_bot.py
    env_file: .env
    depends_on:
      - postgres
      - redis

  # ── Mirror runner — запускает все зеркала из БД ─────────────────────────────
  # Один инстанс держит до ~500 зеркал на asyncio.
  # Для масштабирования запустите несколько инстансов с MIRROR_SHARD_MIN/MAX.
  mirrors:
    build: .
    restart: unless-stopped
    command: python bot/mirror_runner.py
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - sessions:/app/sessions
    # Для масштабирования добавьте ещё один сервис mirrors_2 с другим шардом:
    # environment:
    #   - MIRROR_SHARD_MIN=500000
    #   - MIRROR_SHARD_MAX=1000000

  # ── Воркер рассылок ──────────────────────────────────────────────────────────
  # Один воркер обслуживает ВСЕ зеркала — задачи хранятся в общей БД.
  worker:
    build: .
    restart: unless-stopped
    command: python worker/worker.py
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - sessions:/app/sessions

  # ── FastAPI (CryptoBot webhook) ───────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    command: python api/app.py
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  sessions:
